[project]
name = "library-org-il-helper"
version = "0.1.0"
description = "Account reports and verified renewals through Agron Mobile"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Library IL Helper Contributors" }
]
dependencies = ["httpx>=0.28.0", "tabulate>=0.9.0"]

[project.scripts]
library-il = "library_org_il_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/library_org_il_helper"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "openapi-spec-validator>=0.7.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
